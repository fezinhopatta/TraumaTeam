<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta — OpenWave</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="theme-dark d-flex align-items-center justify-content-center min-vh-100 py-5">
  <main class="card bg-surface border-dark p-4 p-md-5 shadow-lg" style="max-width: 480px; width: 100%;">
    <div class="text-center mb-4">
      <div class="brand-radar mx-auto mb-2"><i class="bi bi-broadcast text-cyan fs-2"></i></div>
      <h3 class="fw-bold text-light mb-1">Junte-se ao Open<span class="text-cyan">Wave</span></h3>
      <p class="text-secondary small mb-0">Crie sua conta para monitorar ou transmitir frequências de rádio</p>
    </div>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="alert alert-cyan alert-dismissible fade show small" role="alert">
          {{ messages[0] }}
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST">
      <div class="mb-3">
        <label for="nome" class="form-label text-light small fw-bold">Nome Completo / Estação *</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-dark text-secondary"><i class="bi bi-person"></i></span>
          <input id="nome" type="text" name="nome" class="form-control bg-dark border-dark text-light" placeholder="Seu nome ou indicativo de rádio" required autofocus>
        </div>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label text-light small fw-bold">E-mail *</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-dark text-secondary"><i class="bi bi-envelope"></i></span>
          <input id="email" type="email" name="email" class="form-control bg-dark border-dark text-light" placeholder="seu@email.com" required>
        </div>
      </div>

      <div class="mb-3">
        <label for="senha" class="form-label text-light small fw-bold">Senha de Acesso *</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-dark text-secondary"><i class="bi bi-lock"></i></span>
          <input id="senha" type="password" name="senha" class="form-control bg-dark border-dark text-light" placeholder="Mínimo 6 caracteres" required>
        </div>
      </div>

      <!-- Papéis do Negócio (Requisito 5) -->
      <div class="mb-4">
        <label class="form-label text-light small fw-bold mb-2">Perfil na Plataforma *</label>
        <div class="row g-2">
          <div class="col-6">
            <input type="radio" class="btn-check" name="role" id="role_listener" value="listener" checked>
            <label class="btn btn-outline-cyan w-100 p-2 text-start h-100" for="role_listener">
              <div class="fw-bold small"><i class="bi bi-headphones me-1"></i> Ouvinte</div>
              <div class="text-secondary" style="font-size: 0.75em;">Cidadão que quer acompanhar ocorrências locais.</div>
            </label>
          </div>
          <div class="col-6">
            <input type="radio" class="btn-check" name="role" id="role_feeder" value="feeder">
            <label class="btn btn-outline-cyan w-100 p-2 text-start h-100" for="role_feeder">
              <div class="fw-bold small"><i class="bi bi-broadcast-pin me-1"></i> Estação (Feeder)</div>
              <div class="text-secondary" style="font-size: 0.75em;">Possui scanner/SDR e quer transmitir canais.</div>
            </label>
          </div>
        </div>
      </div>

      <button type="submit" class="btn btn-cyan w-100 py-2 fw-bold mb-3">
        <i class="bi bi-person-check-fill me-1"></i> Cadastrar no OpenWave
      </button>
    </form>

    <div class="text-center text-secondary small pt-3 border-top border-dark">
      Já possui uma conta? <a href="{{ url_for('login') }}" class="text-cyan text-decoration-none fw-bold">Fazer login</a>
      <div class="mt-2">
        <a href="{{ url_for('index') }}" class="text-secondary text-decoration-none small">&larr; Voltar para a Landing Page</a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
