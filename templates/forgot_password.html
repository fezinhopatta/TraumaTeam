<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Senha — OpenWave</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="theme-dark d-flex align-items-center justify-content-center min-vh-100 py-5">
  <main class="card bg-surface border-dark p-4 p-md-5 shadow-lg" style="max-width: 440px; width: 100%;">
    <div class="text-center mb-4">
      <div class="brand-radar mx-auto mb-2"><i class="bi bi-shield-lock text-cyan fs-2"></i></div>
      <h3 class="fw-bold text-light mb-1">Recuperação de Senha</h3>
      <p class="text-secondary small mb-0">Informe seu e-mail cadastrado no OpenWave</p>
    </div>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="alert alert-cyan alert-dismissible fade show small" role="alert">
          {{ messages[0] }}
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST">
      <div class="mb-4">
        <label for="email" class="form-label text-light small fw-bold">E-mail Cadastrado</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-dark text-secondary"><i class="bi bi-envelope"></i></span>
          <input id="email" type="email" name="email" class="form-control bg-dark border-dark text-light" placeholder="seu@email.com" required autofocus>
        </div>
        <div class="text-secondary small mt-1">Um link com token seguro de 30 minutos será enviado.</div>
      </div>

      <button type="submit" class="btn btn-cyan w-100 py-2 fw-bold mb-3">
        <i class="bi bi-send-fill me-1"></i> Enviar Link de Redefinição
      </button>
    </form>

    <div class="text-center text-secondary small pt-3 border-top border-dark">
      <a href="{{ url_for('login') }}" class="text-cyan text-decoration-none">&larr; Voltar ao Login</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
