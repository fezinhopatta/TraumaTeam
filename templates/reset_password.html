<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Nova Senha — OpenWave</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="theme-dark d-flex align-items-center justify-content-center min-vh-100 py-5">
  <main class="card bg-surface border-dark p-4 p-md-5 shadow-lg" style="max-width: 440px; width: 100%;">
    <div class="text-center mb-4">
      <div class="brand-radar mx-auto mb-2"><i class="bi bi-key-fill text-cyan fs-2"></i></div>
      <h3 class="fw-bold text-light mb-1">Nova Senha</h3>
      <p class="text-secondary small mb-0">Digite sua nova senha de acesso ao OpenWave</p>
    </div>

    {% if error %}
      <div class="alert alert-danger small mb-4" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ error }}
      </div>
      <div class="text-center">
        <a href="{{ url_for('forgot_password') }}" class="btn btn-outline-cyan btn-sm">Solicitar novo link</a>
      </div>
    {% else %}
      <form method="POST">
        <div class="mb-4">
          <label for="nova_senha" class="form-label text-light small fw-bold">Nova Senha</label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-dark text-secondary"><i class="bi bi-lock-fill"></i></span>
            <input id="nova_senha" type="password" name="nova_senha" class="form-control bg-dark border-dark text-light" placeholder="Mínimo 6 caracteres" required autofocus>
          </div>
        </div>

        <button type="submit" class="btn btn-cyan w-100 py-2 fw-bold mb-3">
          <i class="bi bi-check-circle-fill me-1"></i> Redefinir Senha
        </button>
      </form>
    {% endif %}

    <div class="text-center text-secondary small pt-3 border-top border-dark">
      <a href="{{ url_for('login') }}" class="text-cyan text-decoration-none">&larr; Voltar ao Login</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
